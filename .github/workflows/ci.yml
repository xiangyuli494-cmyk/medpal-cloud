name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # apps/api/app 与 packages/core 都要在 sys.path 上，等价于 tools/dev.sh 里那次 export
      PYTHONPATH: apps/api:packages/core
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: lint
        run: python -m ruff check .

      - name: boundary check (B1/B2/B3)
        run: python tools/check_boundaries.py

      - name: guard words
        run: python tools/check_guard_words.py

      - name: tests
        run: python -m pytest -q

      - name: seed + smoke
        run: |
          python -m app.seed
          python -c "from app.main import app; from fastapi.testclient import TestClient; c=TestClient(app); r=c.get('/health'); assert r.status_code==200, r.text; print(r.json())"

      - name: eval
        run: python eval/run_eval.py

  # B4：无 secrets 时 huawei job 必须 skipped 而不是 failed。
  # GitHub 的 job 级 if 不能直接用 secrets，先用一个前置 job 探测并输出标记。
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_huawei: ${{ steps.check.outputs.has_huawei }}
    steps:
      - id: check
        env:
          MEDPAL_DB_DSN: ${{ secrets.MEDPAL_DB_DSN }}
          HUAWEI_GAUSSDB_DSN: ${{ secrets.HUAWEI_GAUSSDB_DSN }}
          HUAWEI_AK: ${{ secrets.HUAWEI_AK }}
          HUAWEI_SK: ${{ secrets.HUAWEI_SK }}
          HUAWEI_OBS_BUCKET: ${{ secrets.HUAWEI_OBS_BUCKET }}
        run: |
          # huawei job 需要 DSN + AK + SK + BUCKET 四样，缺一样就不起 job（少一次白跑）
          DSN="${MEDPAL_DB_DSN:-$HUAWEI_GAUSSDB_DSN}"
          missing=""
          [ -n "$DSN" ]               || missing="$missing MEDPAL_DB_DSN"
          [ -n "$HUAWEI_AK" ]         || missing="$missing HUAWEI_AK"
          [ -n "$HUAWEI_SK" ]         || missing="$missing HUAWEI_SK"
          [ -n "$HUAWEI_OBS_BUCKET" ] || missing="$missing HUAWEI_OBS_BUCKET"
          if [ -n "$missing" ]; then
            echo "缺:$missing —— 跳过 huawei job"
            echo "has_huawei=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_huawei=true" >> "$GITHUB_OUTPUT"
          fi

  huawei:
    needs: check-secrets
    if: needs.check-secrets.outputs.has_huawei == 'true'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: apps/api:packages/core
      MEDPAL_DB_DSN: ${{ secrets.MEDPAL_DB_DSN }}
      HUAWEI_GAUSSDB_DSN: ${{ secrets.HUAWEI_GAUSSDB_DSN }}
      HUAWEI_AK: ${{ secrets.HUAWEI_AK }}
      HUAWEI_SK: ${{ secrets.HUAWEI_SK }}
      HUAWEI_OBS_BUCKET: ${{ secrets.HUAWEI_OBS_BUCKET }}
      HUAWEI_OBS_ENDPOINT: ${{ secrets.HUAWEI_OBS_ENDPOINT }}
      HUAWEI_REGION: ${{ secrets.HUAWEI_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,huawei]"

      - name: smoke huawei (gaussdb + obs)
        run: python scripts/smoke_huawei.py
