<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MedPal Cloud · 可追溯决策链演示</title>
<style>
  :root { --bg:#0b1020; --card:#141a2e; --line:#25304d; --fg:#e8ecf8; --dim:#8b96b5;
          --ok:#3ddc97; --warn:#ffb454; --accent:#6aa6ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.65 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:28px 24px 8px; max-width:1040px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 6px; letter-spacing:.5px; }
  .sub { color:var(--dim); font-size:13px; }
  main { max-width:1040px; margin:0 auto; padding:16px 24px 64px; }
  .row { display:flex; gap:8px; }
  input[type=text] { flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
                     background:var(--card); color:var(--fg); font-size:15px; outline:none; }
  input[type=text]:focus { border-color:var(--accent); }
  button { padding:12px 18px; border-radius:10px; border:0; background:var(--accent);
           color:#08101f; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
  .chip { padding:6px 10px; border:1px solid var(--line); border-radius:999px; color:var(--dim);
          font-size:12px; cursor:pointer; background:transparent; }
  .chip:hover { color:var(--fg); border-color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:18px 20px; margin-top:16px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:1.2px; color:var(--dim);
             margin:0 0 12px; font-weight:600; }
  .stmt { font-size:17px; margin:0 0 14px; }
  .kv { display:flex; gap:18px; flex-wrap:wrap; color:var(--dim); font-size:13px; }
  .kv b { color:var(--fg); font-weight:600; }
  .bar { height:6px; border-radius:4px; background:#1d2740; overflow:hidden; margin-top:8px; }
  .bar > i { display:block; height:100%; background:var(--ok); width:0; transition:width .5s; }
  ol.steps { list-style:none; margin:0; padding:0; }
  ol.steps li { display:grid; grid-template-columns:34px 110px 1fr; gap:10px;
                padding:10px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  ol.steps li:last-child { border-bottom:0; }
  .i { color:var(--dim); font-variant-numeric:tabular-nums; }
  .op { color:var(--accent); font-family:ui-monospace,Consolas,monospace; font-size:13px; }
  .ev { color:var(--dim); font-family:ui-monospace,Consolas,monospace; font-size:12px;
        word-break:break-all; }
  .ev b { color:var(--ok); font-weight:400; }
  .err { color:var(--warn); }
  a { color:var(--accent); }
  footer { max-width:1040px; margin:0 auto; padding:0 24px 40px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>MedPal Cloud · 可追溯决策链</h1>
  <div class="sub">赛题1 演示页：问题 → 证据召回 → 本体多跳 → 结论 + 决策链。每一步都能点回原文锚点。</div>
</header>
<main>
  <div class="row">
    <input id="q" type="text" value="上腹隐痛伴反酸，下一步做什么检查？" />
    <button id="go">提问</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="out"></div>
</main>
<footer>数据为自拟合成样本，仅用于技术演示，不构成任何诊疗建议。</footer>

<script>
var SAMPLES = [
  "上腹隐痛伴反酸，下一步做什么检查？",
  "消化性溃疡该挂哪个科？",
  "幽门螺杆菌阳性怎么处理？",
  "长期吃止痛药，胃黏膜要不要保护？"
];
var $ = function (id) { return document.getElementById(id); };

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function renderChips() {
  var box = $("chips");
  SAMPLES.forEach(function (s) {
    var b = el("button", "chip", s);
    b.onclick = function () { $("q").value = s; ask(); };
    box.appendChild(b);
  });
}

function render(data) {
  var out = $("out");
  out.innerHTML = "";
  if (!data || data.ok === undefined) return;
  var c = data.conclusion || {};

  var card = el("div", "card");
  card.appendChild(el("h2", null, "结论 / " + (data.trace_id || "")));
  card.appendChild(el("p", "stmt", c.statement || "（无）"));
  var kv = el("div", "kv");
  kv.innerHTML = "<span>科室 <b>" + (c.dept || "—") + "</b></span>" +
                 "<span>检查 <b>" + ((c.exams || []).join("、") || "—") + "</b></span>" +
                 "<span>相关用药 <b>" + ((c.drugs || []).join("、") || "—") + "</b></span>" +
                 "<span>本体 <b>" + (data.ontology_version || "—") + "</b></span>" +
                 "<span>耗时 <b>" + (data.elapsed_ms || 0) + " ms</b></span>";
  card.appendChild(kv);
  var pct = Math.round((data.trace_completeness || 0) * 100);
  var label = el("div", "kv");
  label.innerHTML = "<span>溯源完整率 <b>" + pct + "%</b>（证据 " + (data.evidence_count || 0) + " 条）</span>";
  card.appendChild(label);
  var bar = el("div", "bar");
  var fill = el("i");
  fill.style.width = pct + "%";
  bar.appendChild(fill);
  card.appendChild(bar);
  out.appendChild(card);

  var steps = el("div", "card");
  steps.appendChild(el("h2", null, "决策链（可核对）"));
  var ol = el("ol", "steps");
  (data.steps || []).forEach(function (s) {
    var li = el("li");
    li.appendChild(el("span", "i", String(s.i)));
    li.appendChild(el("span", "op", s.op));
    var mid = el("div");
    var outs = typeof s.out === "string" ? s.out : JSON.stringify(s.out);
    mid.appendChild(el("div", null, outs.length > 160 ? outs.slice(0, 160) + "…" : outs));
    var ev = el("div", "ev");
    ev.innerHTML = (s.evidence || []).map(function (e) { return "<b>" + e + "</b>"; }).join("  ") || "—";
    mid.appendChild(ev);
    li.appendChild(mid);
    ol.appendChild(li);
  });
  steps.appendChild(ol);
  out.appendChild(steps);

  if ((data.gaps || []).length) {
    var g = el("div", "card");
    g.appendChild(el("h2", null, "缺口（诚实标注）"));
    data.gaps.forEach(function (x) { g.appendChild(el("div", "ev", x)); });
    out.appendChild(g);
  }
}

function ask() {
  var q = $("q").value.trim();
  if (!q) return;
  var btn = $("go");
  btn.disabled = true;
  $("out").innerHTML = '<div class="card"><h2>推理中</h2><div class="sub">调用 /v1/ask …</div></div>';
  fetch("/v1/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: q, top_k: 8, max_hops: 2 })
  }).then(function (r) { return r.json(); })
    .then(function (data) {
      return fetch("/v1/traces/" + data.trace_id).then(function (r) { return r.json(); })
        .then(function (t) {
          data.steps = t.steps;
          render(data);
        });
    })
    .catch(function (e) {
      $("out").innerHTML = "";
      var c = el("div", "card err", "请求失败：" + e.message);
      $("out").appendChild(c);
    })
    .then(function () { btn.disabled = false; });
}

$("go").onclick = ask;
$("q").addEventListener("keydown", function (e) { if (e.key === "Enter") ask(); });
renderChips();
ask();
</script>
</body>
</html>
